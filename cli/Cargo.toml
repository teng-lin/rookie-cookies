[package]
name = "rookie-cookies-cli"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Cross-platform browser cookie extraction and decryption CLI"
license-file = "../LICENSE.md"
repository = "https://github.com/teng-lin/rookie-cookies"
keywords = ["browser", "cookies", "cookie-extraction", "chrome", "firefox"]
categories = ["authentication", "command-line-utilities"]

[dependencies]
clap = { version = "4.4.6", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
lazy_static = "1.4.0"
rookie-cookies.workspace = true
serde_json = "1.0.107"

[dev-dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }

[features]
default = ["appbound"]
appbound = ["rookie-cookies/appbound"]
# Windows App-Bound canary only; see the rookie-cookies feature of the same name.
e2e-appbound-steering = ["rookie-cookies/e2e-appbound-steering"]

[[bin]]
name = "rookie-cookies"
path = "src/main.rs"

[lints]
workspace = true
